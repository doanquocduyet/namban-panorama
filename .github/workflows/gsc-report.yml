name: Báo cáo index Google Search Console
# Tự đọc trạng thái index từng URL (URL Inspection API) → ghi docs/gsc-status.md.
# Chạy tự động thứ Hai hằng tuần + chạy tay khi cần.
# CHỈ hoạt động sau khi Chú thêm secret GSC_SA_JSON (xem hướng dẫn). Chưa có secret → no-op.
on:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gsc-report
  cancel-in-progress: false
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cài thư viện Google
        run: pip install --quiet google-auth requests
      - name: Đọc GSC + ghi báo cáo
        env:
          GSC_SA_JSON: ${{ secrets.GSC_SA_JSON }}
          GSC_SITE: ${{ vars.GSC_SITE || 'sc-domain:nambanpanorama.com' }}
        run: python3 scripts/gsc_report.py
      - name: Commit báo cáo nếu đổi
        run: |
          git config user.name "namban-gsc-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/gsc-status.md 2>/dev/null || true
          if git diff --cached --quiet; then echo "Không đổi / chưa cấu hình secret."; else
            git commit -m "GSC: cập nhật báo cáo trạng thái index [skip ci]"
            git push
          fi
