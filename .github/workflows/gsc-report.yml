name: Báo cáo index Google Search Console
# Tự đọc trạng thái index từng URL (URL Inspection API) → docs/gsc-status.md,
# và từ khoá · vị trí · lượt hiện · lượt bấm (Search Analytics API) của Panorama + Villas + bảng so 2 web.
# Repo công khai → báo cáo từ khoá được MÃ HOÁ (tools/gsc-encrypt.sh) rồi mới commit vào docs/gsc-private/.
# Khoá mở nằm trong Google Drive của Chú (Google Doc "namban-panorama — khoá mở báo cáo GSC").
# Chạy tự động thứ Hai hằng tuần + chạy tay khi cần.
# CHỈ hoạt động sau khi Chú thêm secret GSC_SA_JSON (xem hướng dẫn). Chưa có secret → no-op.
on:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gsc-report
  cancel-in-progress: false
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cài thư viện Google
        run: pip install --quiet google-auth requests
      - name: Đọc GSC + ghi báo cáo
        env:
          GSC_SA_JSON: ${{ secrets.GSC_SA_JSON }}
          GSC_SITE: ${{ vars.GSC_SITE || 'sc-domain:nambanpanorama.com' }}
        run: python3 scripts/gsc_report.py
      - name: Đọc từ khoá Panorama + Villas (Search Analytics) → mã hoá → docs/gsc-private/
        env:
          GSC_SA_JSON: ${{ secrets.GSC_SA_JSON }}
          GSC_SITE: ${{ vars.GSC_SITE || 'sc-domain:nambanpanorama.com' }}
          GSC_OUT: ${{ runner.temp }}/gsc-out
        run: |
          python3 scripts/gsc_queries.py
          bash tools/gsc-encrypt.sh "$GSC_OUT"
      - name: Commit báo cáo nếu đổi
        run: |
          git config user.name "namban-gsc-bot"
          git config user.email "actions@users.noreply.github.com"
          for f in docs/gsc-status.md docs/gsc-private; do [ -e "$f" ] && git add "$f"; done
          if git diff --cached --quiet; then echo "Không đổi / chưa cấu hình secret."; else
            git commit -m "GSC: cập nhật báo cáo index + từ khoá [skip ci]"
            for i in 1 2 3 4 5; do git push && break; git pull --rebase origin main; sleep $((i*3)); done
          fi
