name: Tạo audio giọng Việt MIỄN PHÍ (Microsoft Neural)

# Chạy thủ công: tab Actions → workflow này → Run workflow. KHÔNG cần API key.
on:
  workflow_dispatch:
    inputs:
      scope:
        description: "Bài nào? (all = tất cả · hoặc slug · hoặc nhiều slug cách nhau dấu phẩy)"
        required: false
        default: "dat-nam-ban-trong-cay-gi"
        type: string
      voice:
        description: "Giọng đọc"
        required: false
        default: "vi-VN-NamMinhNeural"
        type: choice
        options:
          - vi-VN-NamMinhNeural
          - vi-VN-HoaiMyNeural
      overwrite:
        description: "Tạo lại kể cả bài đã có mp3?"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cài edge-tts
        run: pip install --quiet edge-tts
      - name: Tạo audio
        env:
          SCOPE: ${{ github.event.inputs.scope }}
          VOICE: ${{ github.event.inputs.voice }}
          OVERWRITE: ${{ github.event.inputs.overwrite == 'true' && '1' || '0' }}
        run: python3 scripts/gen_audio_edge.py
      - name: Commit & push
        run: |
          git config user.name "namban-audio-bot"
          git config user.email "actions@users.noreply.github.com"
          git add audio/*.mp3 *.html fr/*.html zh/*.html ko/*.html ja/*.html 2>/dev/null || true
          if git diff --cached --quiet; then echo "Không có audio mới."; else
            git commit -m "Audio giọng Việt (Microsoft Neural): cập nhật MP3 + meta"
            # main có thể đã tiến lên trong lúc sinh audio (audio-auto, hoặc người push).
            # Rebase rồi thử lại, đừng để MP3 sinh xong bị vứt vì push bị reject.
            for i in 1 2 3 4 5; do
              if git push; then echo "Đã push."; exit 0; fi
              echo "Push bị từ chối, rebase rồi thử lại (lần $i)..."
              git pull --rebase origin main || exit 1
              sleep 5
            done
            echo "::error::Push thất bại sau 5 lần thử."; exit 1
          fi
