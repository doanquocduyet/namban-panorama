name: IndexNow ping
on:
  push:
    branches: [main]
    paths: ['**/*.html']
permissions:
  contents: read
jobs:
  indexnow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Submit changed URLs to IndexNow
        run: |
          set -e
          HOST="nambanpanorama.com"
          KEY="aeba74e4ac00031d44bcb9899ddda293"
          BEFORE="${{ github.event.before }}"
          SHA="${{ github.sha }}"
          if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            CHANGED=$(git diff --name-only "$BEFORE" "$SHA" -- '*.html')
          else
            CHANGED=$(git diff --name-only HEAD~1 HEAD -- '*.html' || true)
          fi
          # Sửa 17/11/2026 theo FAQ IndexNow + Bing Webmaster Guidelines: báo cả trang đã XOÁ (để Bing gỡ nhanh),
          # bỏ khuôn "_*.html" và trang noindex; "en/index.html" → "/en" (trước đó báo nhầm "/en/index").
          URLS=""
          for f in $CHANGED; do
            case "$(basename "$f")" in _*) continue ;; esac
            case "$f" in docs/*|tools/*|scripts/*|node_modules/*) continue ;; esac
            if [ -f "$f" ] && grep -qiE '<meta[^>]+name="robots"[^>]+noindex' "$f"; then continue; fi
            slug="${f%.html}"
            slug="${slug%/index}"
            if [ "$slug" = "index" ] || [ -z "$slug" ]; then u="https://$HOST/"; else u="https://$HOST/$slug"; fi
            if [ -z "$URLS" ]; then URLS="\"$u\""; else URLS="$URLS,\"$u\""; fi
          done
          if [ -z "$URLS" ]; then echo "No HTML changes to submit"; exit 0; fi
          BODY="{\"host\":\"$HOST\",\"key\":\"$KEY\",\"keyLocation\":\"https://$HOST/$KEY.txt\",\"urlList\":[$URLS]}"
          echo "Body: $BODY"
          curl -sS -X POST "https://api.indexnow.org/indexnow" -H "Content-Type: application/json; charset=utf-8" -d "$BODY" -w "\nHTTP %{http_code}\n"
