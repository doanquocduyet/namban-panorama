name: Đăng Facebook theo hàng đợi

# Chạy trên runner GitHub, KHÔNG chạy từ phiên Claude — ở đó
# graph.facebook.com bị chặn.
#
# CHỈ CẦN MỘT SECRET: FB_PAGE_TOKEN. Page token đã gắn sẵn với đúng một
# Trang nên script tự hỏi `GET /me` ra Page ID, rồi đối chiếu username với
# `nambanpanorama` — lệch thì dừng, không đăng.
#
# Chưa có secret thì script tự chạy khô: in ra bài sắp đăng rồi thoát 0.
# Bật workflow trước, cấp token sau, không run nào đỏ.

on:
  schedule:
    # 11:07 và 20:07 giờ Việt Nam (UTC+7) → 04:07 và 13:07 UTC.
    # Chú chốt 11h/20h ngày 17/9/2026 (đổi từ 12h/21h).
    #
    # ⚠️ CỐ Ý ĐẶT PHÚT LẺ, KHÔNG ĐẶT PHÚT TRÒN. Đo thật trên chính repo này:
    # cron 05:00 chạy lúc 09:39–09:45, cron 14:00 chạy lúc 18:01–18:02 —
    # trễ bốn tiếng, hai ngày liền. GitHub chạy lịch theo kiểu "cố gắng",
    # lúc đông thì xếp hàng, mà phút :00 là lúc đông nhất vì cả thế giới
    # đặt vào đó. Phút lẻ đỡ chen hơn nhiều.
    - cron: "7 4 * * *"
    - cron: "7 13 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Chạy khô — CHỈ in bài ra, KHÔNG đăng (bật lên nếu chỉ muốn xem trước)"
        type: boolean
        # Mặc định false từ 16/9/2026. Trước để true nên bấm nút là chạy khô,
        # Chú tưởng hỏng ("chưa thấy đăng trên facebook") — run #15 đúng kiểu
        # đó. Bấm nút = đăng thật; muốn xem trước thì tự tick vào.
        default: false

permissions:
  contents: write

concurrency:
  group: fb-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      # v5 từ 16/9/2026 — hết cảnh báo "Node 20 deprecated". Đã chạy thật
      # ở run #16: checkout 46 giây, thành công.
      - uses: actions/checkout@v5

      - name: Đăng bài đến hạn
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          # Tuỳ chọn, chỉ đặt khi cần ép một node cụ thể. Bỏ trống là
          # đường đi thường dùng — script tự resolve từ token.
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: python3 tools/fb-post.py

      - name: Ghi lại hàng đợi
        run: |
          if [ -z "$(git status --porcelain data/fb-queue.json)" ]; then
            echo "Hàng đợi không đổi (chạy khô hoặc không có bài đến hạn)."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fb-queue.json
          git commit -m "fb: đánh dấu bài đã đăng"
          # Vòng rebase như hai workflow audio (Luật 21c) — main nhích một
          # commit bất kỳ là push trần bị reject, công sinh ra rồi vứt.
          for i in 1 2 3 4 5; do
            git push origin HEAD:main && exit 0
            git fetch origin main && git rebase origin/main || {
              git checkout --theirs -- data/fb-queue.json
              git add -A && git rebase --continue
            }
          done
          echo "Push thất bại sau 5 lần." >&2
          exit 1
