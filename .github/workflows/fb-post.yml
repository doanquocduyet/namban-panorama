name: Đăng Facebook theo hàng đợi

# Chạy trên runner GitHub, KHÔNG chạy từ phiên Claude — ở đó
# graph.facebook.com bị chặn.
#
# CHỈ CẦN MỘT SECRET: FB_PAGE_TOKEN. Page token đã gắn sẵn với đúng một
# Trang nên script tự hỏi `GET /me` ra Page ID, rồi đối chiếu username với
# `nambanpanorama` — lệch thì dừng, không đăng.
#
# Chưa có secret thì script tự chạy khô: in ra bài sắp đăng rồi thoát 0.
# Bật workflow trước, cấp token sau, không run nào đỏ.

on:
  schedule:
    # Hai lượt mỗi ngày (03:30 + 12:30 UTC) nhưng 5 NGÀY MỚI ĐĂNG MỘT BÀI (Chú chốt 26/11/2026: "5 ngày
    # đăng 1 bài trên facebook, instagram và thread, ưu tiên các bài có tính chất thời điểm mới nhất").
    # Ngày chưa tới lượt thì script in "chưa tới lượt" rồi thoát. Luật chọn bài: tools/social_auto.py.
    # GitHub chạy lịch repo này TRỄ 7–10 GIỜ (đo 30 lượt 11–25/11/2026): lượt 03:30 thực chạy 10:41–13:59 UTC
    # = 17:41–20:59 giờ VN (giờ đẹp), lượt 12:30 thực chạy 18:21–22:38 UTC = 1:21–5:38 sáng giờ VN. Script chỉ
    # đăng trong 7:00–22:00 giờ VN nên lượt đêm tự bỏ; lượt đó chỉ có ích khi GitHub chạy đúng giờ.
    #
    # ⚠️ ĐỪNG ĐẶT PHÚT :00. Đo thật trên chính repo này: cron 05:00 chạy
    # lúc 09:39–09:45, cron 14:00 chạy lúc 18:01–18:02 — trễ bốn tiếng,
    # hai ngày liền. GitHub chạy lịch theo kiểu "cố gắng", lúc đông thì
    # xếp hàng, mà phút :00 là lúc đông nhất vì cả thế giới đặt vào đó.
    # Phút :30 đỡ hơn nhiều; phút lẻ hẳn thì đỡ nhất.
    - cron: "30 3 * * *"
    - cron: "30 12 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Chạy khô — CHỈ in bài ra, KHÔNG đăng (bật lên nếu chỉ muốn xem trước)"
        type: boolean
        # Mặc định false từ 16/9/2026. Trước để true nên bấm nút là chạy khô,
        # Chú tưởng hỏng ("chưa thấy đăng trên facebook") — run #15 đúng kiểu
        # đó. Bấm nút = đăng thật; muốn xem trước thì tự tick vào.
        default: false

permissions:
  contents: write

concurrency:
  group: fb-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      # v5 từ 16/9/2026 — hết cảnh báo "Node 20 deprecated". Đã chạy thật
      # ở run #16: checkout 46 giây, thành công.
      - uses: actions/checkout@v5
        with:
          # đọc hàng đợi MỚI NHẤT lúc job bắt đầu, không phải ảnh chụp lúc run được tạo: run xếp hàng sau một run
          # bấm tay, re-run, và job Threads đứng sau job Instagram phải thấy dấu vừa ghi (phản biện 27/11/2026)
          ref: main

      - name: Đăng bài đến hạn
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          # Tuỳ chọn, chỉ đặt khi cần ép một node cụ thể. Bỏ trống là
          # đường đi thường dùng — script tự resolve từ token.
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          # Bấm nút chạy tay = đăng ngay, bỏ qua nhịp 5 ngày (vẫn theo thứ tự chọn bài).
          SOCIAL_FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: python3 tools/fb-post.py

      - name: Ghi lại hàng đợi
        run: |
          # Dán phiếu lên bản main MỚI NHẤT, không commit bản đã checkout.
          # `actions/checkout` cầm ảnh chụp lúc bấm nút, nên commit bản đó
          # là chắc chắn đụng độ khi có run khác vừa đẩy lên. Xem
          # tools/apply-mark.py để biết cả câu chuyện (lỗi thật 17/9/2026).
          [ -f data/.pending-mark.json ] || { echo "Không có phiếu — không đăng gì."; exit 0; }
          cp data/.pending-mark.json /tmp/mark.json
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/mark.json data/.pending-mark.json
            python3 tools/apply-mark.py || exit 1
            rm -f data/.pending-mark.json
            git diff --quiet -- data/fb-queue.json && { echo "Đã có dấu từ trước."; exit 0; }
            git add data/fb-queue.json
            git commit -m "fb: đánh dấu bài đã đăng"
            git push origin HEAD:main && exit 0
            echo "Push bị chặn, thử lại lần $i..."
          done
          echo "Push thất bại sau 5 lần — BÀI ĐÃ ĐĂNG nhưng chưa đánh dấu." >&2
          exit 1
