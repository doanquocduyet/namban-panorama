name: Đăng Instagram / Threads theo hàng đợi

# Cùng hàng đợi với Facebook (`data/fb-queue.json`), khác cột đánh dấu:
# Facebook "posted" · Instagram "posted_ig" · Threads "posted_threads".
# Ba nơi chạy độc lập — nơi này hỏng không kéo nơi kia dừng.
#
# Chưa có token thì script tự chạy khô, in bài ra rồi thoát 0. Bật workflow
# trước, cấp token sau, không run nào đỏ.
#
# Secret cần:
#   FB_PAGE_TOKEN  — đã có, Instagram dùng chung với Facebook.
#   THREADS_TOKEN  — riêng của Threads, lấy ở threads.net (mục 0-C).

on:
  schedule:
    # 11:37 và 20:37 giờ Việt Nam (UTC+7) → 04:37 và 13:37 UTC.
    # Lệch 30 phút so với Facebook (11:07 / 20:07) để ba nơi không cùng đăng
    # một lúc — nhìn như máy chạy thì người đọc thấy ngay.
    # Phút lẻ là cố ý, xem ghi chú ở `fb-post.yml`: phút tròn bị xếp hàng lâu.
    - cron: "37 4 * * *"
    - cron: "37 13 * * *"
  workflow_dispatch:
    inputs:
      platform:
        description: "Nền tảng"
        type: choice
        options: [ca-hai, instagram, threads]
        default: ca-hai
      dry_run:
        description: "Chạy khô — CHỈ in bài ra, KHÔNG đăng"
        type: boolean
        default: false
      threads_full:
        description: "Threads: đăng NGUYÊN BÀI (chuỗi 12-18 mắt xích). Tắt = chỉ câu mồi, 2-3 bài"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: social-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    strategy:
      # Chạy lần lượt, không song song: hai job cùng sửa `fb-queue.json`
      # rồi cùng push là đúng cảnh Luật 21d (đụng độ lúc rebase).
      max-parallel: 1
      # Nhánh này hỏng KHÔNG được kéo nhánh kia chết theo. Gặp thật
      # 16/9/2026: Instagram thiếu quyền nên lỗi, GitHub huỷ luôn nhánh
      # Threads đang xếp hàng — đúng thứ mục tiêu "ba nơi chạy độc lập"
      # ở đầu file muốn tránh.
      fail-fast: false
      matrix:
        platform: [instagram, threads]
    steps:
      - uses: actions/checkout@v5

      - name: Đăng bài đến hạn
        # Bấm tay chọn một nền tảng thì bỏ qua nhánh kia.
        if: >-
          github.event_name != 'workflow_dispatch' ||
          inputs.platform == 'ca-hai' ||
          inputs.platform == matrix.platform
        env:
          PLATFORM: ${{ matrix.platform }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          SOCIAL_DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          THREADS_FULL: ${{ inputs.threads_full && '1' || '' }}
        run: python3 tools/social-post.py

      - name: Ghi lại hàng đợi
        run: |
          # Dán phiếu lên bản main MỚI NHẤT — xem tools/apply-mark.py.
          # Đây đúng là chỗ vỡ 17/9/2026: nhánh Instagram đẩy xong, nhánh
          # Threads vẫn cầm bản cũ do checkout ghim theo commit, nên rebase
          # CONFLICT rồi chết vì runner không có trình soạn thảo. Bài đã
          # đăng thật mà hàng đợi không ghi — lần sau đăng trùng.
          [ -f data/.pending-mark.json ] || { echo "Không có phiếu — không đăng gì."; exit 0; }
          cp data/.pending-mark.json /tmp/mark.json
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/mark.json data/.pending-mark.json
            python3 tools/apply-mark.py || exit 1
            rm -f data/.pending-mark.json
            git diff --quiet -- data/fb-queue.json && { echo "Đã có dấu từ trước."; exit 0; }
            git add data/fb-queue.json
            git commit -m "social: đánh dấu bài đã đăng (${{ matrix.platform }})"
            git push origin HEAD:main && exit 0
            echo "Push bị chặn, thử lại lần $i..."
          done
          echo "Push thất bại sau 5 lần — BÀI ĐÃ ĐĂNG nhưng chưa đánh dấu." >&2
          exit 1
