name: Namban Index — đo giá rao hằng tuần
# Thứ Hai 02:00 giờ VN (Chủ nhật 19:00 UTC). Lấy tin công khai (kiểm robots.txt từng URL),
# gộp thành số tổng hợp vào data/index/monthly.json, sinh lại các khối số của namban-index.html + entry llms-full.
# Bất thường (ít tin mới, lệch >25%, một nguồn về 0, Villas >40%) → chỉ ghi data/index/alert.json, KHÔNG sửa trang.
# Không lưu tựa/URL/SĐT vào repo; dòng thô chỉ giữ 30 ngày trong artifact của run.
# 25/9/2026: mỗi nguồn một máy chạy song song (trước chạy tuần tự ~60 phút); mỗi máy chỉ gọi một host nên
# nhịp nghỉ giữa các lần mở tin với từng trang vẫn giữ nguyên như cũ.
on:
  schedule:
    - cron: '0 19 * * 0'
  workflow_dispatch:
permissions:
  contents: write
  actions: write   # gọi generate-audio-free cho bài "giá hiện tại" vừa đổi số (19/11/2026)
concurrency:
  group: index-weekly
  cancel-in-progress: false
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        source: [guland, batdongsanonline, datnenlamdong, thuviennhadat, muaban, mogi, nambanvillas, villasdigest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests beautifulsoup4 lxml
      - name: Lấy tin — ${{ matrix.source }}
        run: |
          timeout 25m python tools/survey/crawl.py ${{ matrix.source }} || echo "${{ matrix.source }}: hết giờ/lỗi — giữ phần đã có"
      - uses: actions/upload-artifact@v4
        with:
          name: raw-${{ matrix.source }}
          path: survey/out/
          retention-days: 1
          if-no-files-found: ignore
  weekly:
    needs: crawl
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: raw-*
          path: survey/out/
          merge-multiple: true
      - name: Gộp + điều kiện dừng
        id: agg
        run: |
          set +e
          ls survey/out/
          python tools/survey/aggregate.py; rc=$?
          echo "rc=$rc" >> $GITHUB_OUTPUT
          [ $rc -eq 0 ] || [ $rc -eq 3 ] || exit $rc
      - name: Sinh lại các khối số của Index + entry llms-full
        if: steps.agg.outputs.rc == '0'
        run: |
          python tools/gen-index-history.py
          # bài "giá hiện tại" vừa được bộ sinh đổi số (tools/idx-live-state.json) → ô "Cập nhật d/m/yyyy" tĩnh theo dateModified mới
          python tools/sync-updated-date.py
          python tools/gen-llms-index-entry.py || echo "llms-full: không đồng bộ (Luật 25 chặn) — trang vẫn cập nhật"
          # ô hỏi–đáp (ô tìm kiếm + /hoi-nhanh) trả nguyên văn FAQ Index → số giá phải theo kịp mỗi tuần (19/11/2026)
          python tools/gen-chat-index.py || echo "chat-index: không sinh lại được — ô hỏi–đáp giữ số tuần trước"
      - name: Lưu dòng thô 30 ngày (không vào repo)
        uses: actions/upload-artifact@v4
        with:
          name: tin-rao-${{ github.run_id }}
          path: survey/out/
          retention-days: 30
      - name: Commit số tổng hợp
        run: |
          rm -rf survey/out
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # index.html + mọi trang có <span data-idx-period> + llms.txt: nhãn kỳ Index tự đổi theo tháng (4/11/2026)
          git add data/index namban-index.html llms.txt llms-full.txt sitemap.xml chat-index.json tools/idx-live-state.json
          git add -u -- '*.html'
          if [ "${{ steps.agg.outputs.rc }}" = "0" ]; then msg="Index: số đo giá rao tuần $(date -u +%G-W%V) (tự động)"; else msg="Index: cảnh báo tuần $(date -u +%G-W%V) — không sửa trang (tự động)"; fi
          git commit -m "$msg" || exit 0
          for i in 1 2 3 4 5; do git push origin HEAD:main && break; git pull --rebase origin main; done
      - name: Sinh lại audio các bài "giá hiện tại" vừa đổi số (lời đọc có số giá)
        # Chạy SAU khi commit đã lên main (Luật 16/21). Commit của bot không kích audio-auto nên không đua nhau.
        if: steps.agg.outputs.rc == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f .idx-live-changed ] || exit 0
          S=""
          for f in $(cat .idx-live-changed); do
            grep -q 'name="pm-audio" content="/audio/' "$f" && S="$S${S:+,}${f%.html}"
          done
          [ -n "$S" ] || { echo "Không bài nào có audio."; exit 0; }
          echo "Sinh lại audio: $S"
          gh workflow run generate-audio-free.yml --ref main -f scope="$S" -f overwrite=true || echo "::warning::không gọi được generate-audio-free"
      - name: Báo IndexNow trang Index vừa đổi số (Bing, Copilot, ChatGPT search)
        # commit của bot đẩy bằng GITHUB_TOKEN không kích workflow indexnow.yml, nên báo thẳng ở đây
        if: steps.agg.outputs.rc == '0'
        run: |
          sleep 90
          # Index + các bài "giá hiện tại" vừa đổi số trong lượt này (.idx-live-changed do gen-index-history.py ghi, không vào repo)
          URLS='"https://nambanpanorama.com/namban-index"'
          if [ -f .idx-live-changed ]; then
            for f in $(cat .idx-live-changed); do URLS="$URLS,\"https://nambanpanorama.com/${f%.html}\""; done
          fi
          curl -sS -X POST "https://api.indexnow.org/indexnow" -H "Content-Type: application/json; charset=utf-8" \
            -d "{\"host\":\"nambanpanorama.com\",\"key\":\"aeba74e4ac00031d44bcb9899ddda293\",\"keyLocation\":\"https://nambanpanorama.com/aeba74e4ac00031d44bcb9899ddda293.txt\",\"urlList\":[$URLS]}" \
            -w "\nHTTP %{http_code}\n" || true
