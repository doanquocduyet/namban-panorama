<!DOCTYPE html>
<html lang="vi">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Không tìm thấy trang này | Namban Panorama</title>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500&family=Be+Vietnam+Pro:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#1a1815;--paper:#f1ece2;--card:#faf6ee;--forest:#2f4034;--forest-deep:#1e2a20;--clay:#9d5d38;--clay-soft:#bb8862;--stone:#a79c87;--muted:#6e6759;--line:#e1d9c8;}
*{margin:0;padding:0;box-sizing:border-box;}
html{overflow-x:clip;}
body{font-family:'Be Vietnam Pro',sans-serif;background:var(--paper);color:var(--ink);line-height:1.7;font-weight:300;-webkit-font-smoothing:antialiased;min-height:100dvh;display:flex;flex-direction:column;}
a{color:inherit;text-decoration:none;}
nav{border-bottom:1px solid var(--line);}
.navin{max-width:1080px;margin:0 auto;padding:0 40px;display:flex;align-items:center;height:68px;}
.logo{font-family:'Fraunces',serif;font-weight:500;font-size:19px;letter-spacing:1.4px;}
main{flex:1;display:flex;align-items:center;}
.wrap{max-width:640px;margin:0 auto;padding:72px 40px 88px;}
.eyebrow{font-size:10.5px;letter-spacing:3px;text-transform:uppercase;color:var(--stone);margin-bottom:18px;}
h1{font-family:'Fraunces',serif;font-weight:400;font-size:clamp(27px,4.4vw,38px);line-height:1.2;letter-spacing:-.5px;margin-bottom:16px;text-wrap:balance;}
.lead{font-size:16.5px;color:var(--muted);margin-bottom:36px;text-wrap:pretty;}
.links{border-top:1px solid var(--line);}
.links a{display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding:16px 2px;border-bottom:1px solid var(--line);transition:padding-left .35s cubic-bezier(.22,1,.36,1);}
.links a:hover{padding-left:9px;}
.links .t{font-family:'Fraunces',serif;font-size:17.5px;line-height:1.3;}
.links .s{font-size:12.5px;color:var(--muted);}
.links .n{font-family:'Fraunces',serif;font-style:italic;color:var(--stone);font-size:15px;flex-shrink:0;}
footer{border-top:1px solid var(--line);padding:30px 0;}
footer .wrap{max-width:1080px;padding:0 40px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px;}
.fb{font-family:'Fraunces',serif;font-size:16px;}
.fb span{color:var(--clay);}
.fn{font-size:12px;color:var(--stone);}
@media(max-width:640px){.navin,.wrap,footer .wrap{padding-left:24px;padding-right:24px;}.wrap{padding-top:52px;padding-bottom:64px;}}
::selection{background:var(--forest);color:var(--paper);}
</style>
</head>
<body>

<nav>
  <div class="navin"><a href="/" class="logo">NAMBAN PANORAMA</a></div>
</nav>

<main>
  <div class="wrap">
    <div class="eyebrow">404</div>
    <h1>Không tìm thấy trang này.</h1>
    <p class="lead">Có thể đường dẫn đã đổi, hoặc bài chưa từng tồn tại.</p>

    <div class="links">
      <a href="/"><span><span class="t">Về trang chủ</span><br><span class="s">Bắt đầu lại từ đầu.</span></span><span class="n">&rarr;</span></a>
      <a href="/nam-ban"><span><span class="t">Về Nam Ban</span><br><span class="s">Vùng đất, đời sống, con người.</span></span><span class="n">&rarr;</span></a>
      <a href="/dat"><span><span class="t">Về Đất</span><br><span class="s">Pháp lý, giá, cách đọc một lô đất.</span></span><span class="n">&rarr;</span></a>
    </div>
  </div>
</main>

<footer>
  <div class="wrap">
    <div class="fb">Namban <span>Panorama</span></div>
    <div class="fn">Hiểu vùng đất trước khi hiểu giá đất.</div>
  </div>
</footer>

</body>
</html>
